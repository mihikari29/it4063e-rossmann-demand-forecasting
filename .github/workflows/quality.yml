name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: uv sync --locked --extra dev --extra api
      - name: Check dependencies
        run: uv pip check
      - name: Test fixtures
        run: uv run --locked --extra dev --extra api python -m pytest
      - name: Lint
        run: uv run --locked --extra dev --extra api python -m ruff check .
      - name: Check formatting
        run: uv run --locked --extra dev --extra api python -m ruff format --check .
      - name: Check Markdown links
        run: uv run --locked --extra dev --extra api python scripts/check_docs.py
