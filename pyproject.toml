[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rossmann-demand-forecasting"
version = "0.1.0"
description = "Store-level Rossmann demand forecasting and inventory decision support"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=20,<25",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
acquisition = [
    "kaggle>=2.2,<3",
]
dev = [
    "ipykernel>=6.29,<7",
    "nbclient>=0.10,<0.11",
    "pytest>=8,<10",
    "ruff>=0.12,<0.17",
]

[project.scripts]
rossmann-acquire = "rossmann_forecasting.data.acquisition:cli_main"
rossmann-validate = "rossmann_forecasting.data.validation:cli_main"
rossmann-prepare = "rossmann_forecasting.data.preparation:cli_main"
rossmann-eda = "rossmann_forecasting.analysis.eda:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
